spring.datasource.url=jdbc:postgresql://${WIREDACADEMY_DB_HOST:localhost}:${WIREDACADEMY_DB_PORT:5433}/wiredacademy_test
spring.datasource.username=${WIREDACADEMY_DB_USER:wiredacademy_app}
spring.datasource.password=${WIREDACADEMY_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

logging.level.WiredAcademy.EVENTBUS=DEBUG

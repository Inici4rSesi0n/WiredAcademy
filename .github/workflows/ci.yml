name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master, main ]

jobs:
  fast-tests:
    name: Fast Tests (Unit + Integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wiredacademy_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: wiredacademy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run fast tests (unit + integration, no UI)
        env:
          WIREDACADEMY_DB_HOST: localhost
          WIREDACADEMY_DB_PORT: 5433
          WIREDACADEMY_DB_USER: wiredacademy_app
          WIREDACADEMY_DB_PASSWORD: ci_test_password
        run: mvn clean test

  full-tests:
    name: Full Tests (Unit + Integration + UI)
    runs-on: ubuntu-latest
    needs: fast-tests
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wiredacademy_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: wiredacademy_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run full test suite (unit + integration + UI)
        env:
          WIREDACADEMY_DB_HOST: localhost
          WIREDACADEMY_DB_PORT: 5433
          WIREDACADEMY_DB_USER: wiredacademy_app
          WIREDACADEMY_DB_PASSWORD: ci_test_password
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          mvn clean test -Pfull
